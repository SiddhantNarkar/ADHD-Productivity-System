{% extends 'index.html' %}
{% load static %}

{% block title %}
        <title>ADHD Productivity System</title>
{% endblock %}

{% block content %}

    <section class="login-section d-flex justify-content-center align-items-center mt-5 mb-5">
        <div class="login-box shadow  mt-5 mb-3" id="loginBox">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <h2 class="login-title">Sign In</h2>

            <form action="" class="login-form" method="POST">
                {% csrf_token %}
                <input class="login-input" type="email" name="email" required placeholder="E-mail">
                <input class="login-input" type="password" name="password" required placeholder="Password">

                <button class="login-submit-btn" type="submit">Sign In</button>
            </form>

            <p class="login-footer-text">
                New to ADHD Productivity?
                <a class="login-link" href="{% url 'account_type_view_urls' %}">Create an account!</a>
            </p>

        </div>
    </section>

{% endblock %}
