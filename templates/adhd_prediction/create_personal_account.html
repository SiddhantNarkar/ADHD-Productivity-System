{% extends 'index.html' %}
{% load static %}

{% block title %}
        <title>ADHD Productivity System</title>
{% endblock %}

{% block content %}

    <!-- Create Account Section -->
    <section class="login-section mt-5 mb-5">
        <div class="login-box shadow mt-5 mb-3" id="registerBox">

            <h2 class="login-title">Create Account</h2>

            <form action="" class="login-form" method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Profile Photo Container -->
                <div class="profile-pic-wrapper">
                    <img id="profilePreview" src="{% static 'images/men.jpg' %}" class="profile-pic" alt="Profile Image">

                    <!-- Hidden File Input -->
                    <input type="file" name="profile_image" id="profileImageInput" accept="image/*" style="display: none;">

                    <!-- Camera Button -->
                    <label for="profileImageInput" class="camera-btn">
                        <i class="fas fa-camera"></i>
                    </label>
                </div>

                <!-- Full Name -->
                <input class="login-input" type="text" name="full_name" placeholder="Full Name" required>

                <!-- Email -->
                <input class="login-input" type="email" name="email" placeholder="E-mail" required>

                <!-- Phone -->
                <input class="login-input" type="tel" name="phone" placeholder="Phone Number" required>

                <!-- Date of Birth -->
                <input class="login-input" type="date" name="dob" required>

                <!-- Gender -->
                <select class="login-input" name="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

                <!-- Occupation -->
                <select class="login-input" name="occupation" required>
                    <option value="" disabled selected>Select Occupation</option>

                    <option value="Student">Student</option>
                    <option value="Working Professional">Working Professional</option>
                    <option value="Self-Employed">Self-Employed</option>
                    <option value="Homemaker">Homemaker</option>
                    <option value="Unemployed">Unemployed</option>
                    <option value="Retired">Retired</option>
                    <option value="Other">Other</option>
                </select>

                <!-- Complete Address -->
                <input class="login-input" type="text" name="complete_address" placeholder="Complete Address" required>

                <!-- State -->
                <select class="login-input" name="state" required>
                    <option value="" disabled selected>Select State</option>

                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                    <option value="Assam">Assam</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Chhattisgarh">Chhattisgarh</option>
                    <option value="Goa">Goa</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                    <option value="Jharkhand">Jharkhand</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Manipur">Manipur</option>
                    <option value="Meghalaya">Meghalaya</option>
                    <option value="Mizoram">Mizoram</option>
                    <option value="Nagaland">Nagaland</option>
                    <option value="Odisha">Odisha</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Sikkim">Sikkim</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Tripura">Tripura</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Uttarakhand">Uttarakhand</option>
                    <option value="West Bengal">West Bengal</option>
                </select>

                <!-- Country -->
                <select class="login-input" name="country" required>
                    <option value="" disabled selected>Select Country</option>
                    <option>India</option>
                </select>

                <!-- Blood Group -->
                <select class="login-input" name="blood_group" required>
                    <option value="" disabled selected>Blood Group</option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>

                    <option value="B+">B+</option>
                    <option value="B-">B-</option>

                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>

                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>


                <!-- Password -->
                <input class="login-input" type="password" name="password" placeholder="Password" required>
                <input class="login-input" type="password" name="confirm_password" placeholder="Confirm Password" required>

                <!-- Account Type Hidden Field -->
                <input type="hidden" name="account_type" value="Personal Account">


                <button class="login-submit-btn" type="submit">Create Account</button>

            </form>

            <p class="login-footer-text">
                Already have an account?
                <a class="login-link" href="{% url 'login_view_urls' %}">Sign In Now</a>
            </p>

        </div>
    </section>

{% endblock %}
