{% extends 'base.html' %}
{% load static %}

{% block title %}
    <title>ADHD Productivity System</title>
    <link rel="stylesheet" href="{% static 'css/create_personal_account.css' %}">
{% endblock %}

{% block content %}

    <!-- Create Account Section -->
    <section class="login-section mt-5 mb-5">
        <div class="login-box shadow mt-5 mb-3" id="registerBox">

            <h2 class="login-title">Edit Profile</h2>

            <form action="" class="login-form" method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Profile Photo Container -->
                <div class="profile-pic-wrapper">
                    <img id="profilePreview" src="{{ user.profile_image.url }}" class="profile-pic" alt="Profile Image">

                    <!-- Hidden File Input -->
                    <input type="file" name="profile_image" id="profileImageInput" accept="image/*" style="display: none;">

                    <!-- Camera Button -->
                    <label for="profileImageInput" class="camera-btn">
                        <i class="fas fa-camera"></i>
                    </label>
                </div>

                <!-- Full Name -->
                <input class="login-input" type="text" name="full_name" value="{{ user.full_name }}" required>

                <!-- Email -->
                <input class="login-input" type="email" value="{{ user.email }}" readonly>

                <!-- Phone -->
                <input class="login-input" type="tel" name="phone" value="{{ user.phone }}" required>

                <!-- Date of Birth -->
                <input class="login-input" type="date" name="dob" value="{{ user.dob | date:'Y-m-d' }}" required>

                <!-- Gender -->
                <select class="login-input" name="gender" required>
                    <option disabled>Gender</option>
                    <option value="Male" {% if user.gender == "Male" %}selected{% endif %}>Male</option>
                    <option value="Female" {% if user.gender == "Female" %}selected{% endif %}>Female</option>
                    <option value="Other" {% if user.gender == "Other" %}selected{% endif %}>Other</option>
                </select>


                <!-- Occupation -->
                <select class="login-input" name="occupation" required>
                    <option value="Student" {% if user.occupation == "Student" %}selected{% endif %}>Student</option>
                    <option value="Working Professional" {% if user.occupation == "Working Professional" %}selected{% endif %}>Working Professional</option>
                    <option value="Self-Employed" {% if user.occupation == "Self-Employed" %}selected{% endif %}>Self-Employed</option>
                    <option value="Homemaker" {% if user.occupation == "Homemaker" %}selected{% endif %}>Homemaker</option>
                    <option value="Unemployed" {% if user.occupation == "Unemployed" %}selected{% endif %}>Unemployed</option>
                    <option value="Retired" {% if user.occupation == "Retired" %}selected{% endif %}>Retired</option>
                    <option value="Other" {% if user.occupation == "Other" %}selected{% endif %}>Other</option>
                </select>


                <!-- Complete Address -->
                <input class="login-input" type="text" name="complete_address" value="{{ user.complete_address }}" placeholder="Complete Address" required>

                <!-- State -->
                <select class="login-input" name="state" required>
                    <option value="Andhra Pradesh" {% if user.state == "Andhra Pradesh" %}selected{% endif %}>Andhra Pradesh</option>
                    <option value="Arunachal Pradesh" {% if user.state == "Arunachal Pradesh" %}selected{% endif %}>Arunachal Pradesh</option>
                    <option value="Assam" {% if user.state == "Assam" %}selected{% endif %}>Assam</option>
                    <option value="Bihar" {% if user.state == "Bihar" %}selected{% endif %}>Bihar</option>
                    <option value="Chhattisgarh" {% if user.state == "Chhattisgarh" %}selected{% endif %}>Chhattisgarh</option>
                    <option value="Goa" {% if user.state == "Goa" %}selected{% endif %}>Goa</option>
                    <option value="Gujarat" {% if user.state == "Gujarat" %}selected{% endif %}>Gujarat</option>
                    <option value="Haryana" {% if user.state == "Haryana" %}selected{% endif %}>Haryana</option>
                    <option value="Himachal Pradesh" {% if user.state == "Himachal Pradesh" %}selected{% endif %}>Himachal Pradesh</option>
                    <option value="Jharkhand" {% if user.state == "Jharkhand" %}selected{% endif %}>Jharkhand</option>
                    <option value="Karnataka" {% if user.state == "Karnataka" %}selected{% endif %}>Karnataka</option>
                    <option value="Kerala" {% if user.state == "Kerala" %}selected{% endif %}>Kerala</option>
                    <option value="Madhya Pradesh" {% if user.state == "Madhya Pradesh" %}selected{% endif %}>Madhya Pradesh</option>
                    <option value="Maharashtra" {% if user.state == "Maharashtra" %}selected{% endif %}>Maharashtra</option>
                    <option value="Manipur" {% if user.state == "Manipur" %}selected{% endif %}>Manipur</option>
                    <option value="Meghalaya" {% if user.state == "Meghalaya" %}selected{% endif %}>Meghalaya</option>
                    <option value="Mizoram" {% if user.state == "Mizoram" %}selected{% endif %}>Mizoram</option>
                    <option value="Nagaland" {% if user.state == "Nagaland" %}selected{% endif %}>Nagaland</option>
                    <option value="Odisha" {% if user.state == "Odisha" %}selected{% endif %}>Odisha</option>
                    <option value="Punjab" {% if user.state == "Punjab" %}selected{% endif %}>Punjab</option>
                    <option value="Rajasthan" {% if user.state == "Rajasthan" %}selected{% endif %}>Rajasthan</option>
                    <option value="Sikkim" {% if user.state == "Sikkim" %}selected{% endif %}>Sikkim</option>
                    <option value="Tamil Nadu" {% if user.state == "Tamil Nadu" %}selected{% endif %}>Tamil Nadu</option>
                    <option value="Telangana" {% if user.state == "Telangana" %}selected{% endif %}>Telangana</option>
                    <option value="Tripura" {% if user.state == "Tripura" %}selected{% endif %}>Tripura</option>
                    <option value="Uttar Pradesh" {% if user.state == "Uttar Pradesh" %}selected{% endif %}>Uttar Pradesh</option>
                    <option value="Uttarakhand" {% if user.state == "Uttarakhand" %}selected{% endif %}>Uttarakhand</option>
                    <option value="West Bengal" {% if user.state == "West Bengal" %}selected{% endif %}>West Bengal</option>
                </select>

                <!-- Country -->
                <select class="login-input" name="country" required>
                    <option value="India" {% if user.country == "India" %}selected{% endif %}>India</option>
                </select>


                <!-- Blood Group -->
                <select class="login-input" name="blood_group" required>
                    <option value="A+" {% if user.blood_group == "A+" %}selected{% endif %}>A+</option>
                    <option value="A-" {% if user.blood_group == "A-" %}selected{% endif %}>A-</option>
                    <option value="B+" {% if user.blood_group == "B+" %}selected{% endif %}>B+</option>
                    <option value="B-" {% if user.blood_group == "B-" %}selected{% endif %}>B-</option>
                    <option value="AB+" {% if user.blood_group == "AB+" %}selected{% endif %}>AB+</option>
                    <option value="AB-" {% if user.blood_group == "AB-" %}selected{% endif %}>AB-</option>
                    <option value="O+" {% if user.blood_group == "O+" %}selected{% endif %}>O+</option>
                    <option value="O-" {% if user.blood_group == "O-" %}selected{% endif %}>O-</option>
                </select>

                <button class="login-submit-btn" type="submit">Update Account</button>

            </form>

        </div>
    </section>

    <script src="{% static 'javascript/personal_account.js' %}"></script>

{% endblock %}
